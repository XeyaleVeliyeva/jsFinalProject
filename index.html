<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="headerColor"></div>
      <div class="mainPart">
        <h1>To-Do List</h1>
        <div class="addTextPart">
          <img class="upDown" src="./img/down.svg" alt="img" />
          <div class="inpText">
            <input type="text" />
            <button class="inpTextBtn">
              <img src="./img/xbtn.svg" alt="" />
            </button>
          </div>
          <div class="extraWrapper" style="display: none">
            <div class="extraTextContainer"></div>
          </div>
        </div>
        <div class="addText">
          <button class="addBtn">+</button>
          <button class="add">Add</button>
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
